name: Build APK

on:
  push:
    branches:
      - claude/android-timetable-app-5tu2qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetable-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: TimeTable APK (latest debug build)
          body: |
            Latest debug build of the TimeTable app.
            Download `app-debug.apk` below and install it on your Android device
            (you may need to allow "Install unknown apps" for your browser/files app).
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
